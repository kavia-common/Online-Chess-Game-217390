[tool.black]
line-length = 88
target-version = ["py38"]

[tool.ruff]
line-length = 88
target-version = "py38"
# Keep linting conservative; focus on common correctness/style.
lint.select = ["E", "F", "W", "I", "B"]
lint.ignore = [
  # We'll keep some legacy patterns as-is where changing could be behavior-affecting.
]
lint.fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# This project has legacy/educational code patterns; allow broader exceptions
# where refactoring would be more invasive.
"game.py" = ["E402"]
"piece.py" = []
"server.py" = []
